<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>出货记录</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: #f5f7fa;
  color: #1f2937;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}
header {
  background: linear-gradient(135deg, #1677ff 0%, #0b5ed7 100%);
  color: #fff;
  padding: 24px 20px 30px;
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  box-shadow: 0 4px 12px rgba(11, 94, 215, 0.15);
}
header h1 {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
header .meta {
  font-size: 14px;
  opacity: 0.92;
  line-height: 1.6;
  margin-top: 8px;
}
header .meta b {
  opacity: 0.7;
  font-weight: 500;
  margin-right: 4px;
}
.info {
  background: #fff;
  margin: -16px 14px 14px;
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
}
.info-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 14px;
  border-bottom: 1px solid #f0f0f0;
}
.info-row:last-child { border-bottom: none; }
.info-row .k { color: #6b7280; }
.info-row .v { color: #1f2937; font-weight: 500; text-align: right; max-width: 60%; word-break: break-word; }
.section-title {
  padding: 14px 18px 8px;
  font-size: 14px;
  font-weight: 600;
  color: #6b7280;
}
.gallery {
  padding: 4px 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.gallery figure {
  position: relative;
  margin: 0;
  border-radius: 8px;
  overflow: hidden;
  background: #e5e7eb;
  aspect-ratio: 3 / 4;
  cursor: zoom-in;
}
.gallery img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.gallery .zoom-hint {
  position: absolute;
  right: 6px;
  bottom: 6px;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(0, 0, 0, .45);
  color: #fff;
  font-size: 10px;
  line-height: 1.5;
  pointer-events: none;
}
.remark {
  margin: 12px 14px 18px;
  padding: 12px 14px;
  background: #fef3c7;
  border-left: 3px solid #f59e0b;
  border-radius: 6px;
  font-size: 14px;
  color: #78350f;
  word-break: break-word;
  white-space: pre-wrap;
}
.loading {
  text-align: center;
  padding: 80px 20px;
  color: #9ca3af;
  font-size: 14px;
}
.notfound {
  text-align: center;
  padding: 80px 20px;
}
.notfound h2 { color: #6b7280; font-size: 18px; margin-bottom: 12px; font-weight: 500; }
.notfound p { color: #9ca3af; font-size: 14px; }
.footer {
  text-align: center;
  padding: 30px 20px 20px;
  font-size: 12px;
  color: #9ca3af;
}
.video-block {
  margin: 12px 14px;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
}
video { width: 100%; display: block; }

/* ===== 全屏看大图 ===== */
#lightbox {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #000;
  display: none;
  flex-direction: column;
}
#lightbox.on { display: flex; }
#lb-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  color: #fff;
  font-size: 14px;
  flex: 0 0 auto;
}
#lb-stage {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
#lb-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transform-origin: center center;
  will-change: transform;
  -webkit-user-drag: none;
  -webkit-touch-callout: none;
  user-select: none;
}
#lb-nav {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  padding: 12px 0;
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
}
#lb-nav button {
  width: 46px; height: 46px;
  border: 0; border-radius: 50%;
  background: rgba(255,255,255,.14);
  color: #fff; font-size: 20px;
  cursor: pointer;
}
#lb-nav button:disabled { opacity: .3; }
#lb-tip {
  text-align: center;
  color: rgba(255,255,255,.55);
  font-size: 11px;
  padding-bottom: 10px;
  flex: 0 0 auto;
}
</style>
</head>
<body>
<div id="app">
  <div class="loading">加载出货记录中...</div>
</div>

<div id="lightbox">
  <div id="lb-top">
    <span style="width:34px"></span>
    <span id="lb-count">1 / 1</span>
    <span style="width:34px"></span>
  </div>
  <div id="lb-stage"><img id="lb-img" alt=""></div>
  <div id="lb-nav">
    <button id="lb-prev" aria-label="上一张">‹</button>
    <button id="lb-next" aria-label="下一张">›</button>
  </div>
  <div id="lb-tip">点一下关闭 · 右滑关闭 · 双击放大</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const rid = params.get('id');
const app = document.getElementById('app');

let photoList = [];   // 全屏查看用的 URL 列表
let lbIdx = 0;

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderHeader(d) {
  const photoCount = (d.photos || []).length;
  return `
    <header>
      <h1>📦 ${escapeHtml(d.customer || '出货记录')}</h1>
      <div class="meta">
        <b>点位</b>${escapeHtml(d.position || '-')}<br>
        <b>时间</b>${escapeHtml(d.dateTime || '-')}<br>
        <b>照片</b>${photoCount} 张${d.hasVideo ? ' + 1 视频' : ''}
      </div>
    </header>
  `;
}

async function load() {
  if (!rid) {
    app.innerHTML = `<div class="notfound"><h2>缺少 id 参数</h2><p>URL 应为 ?id=XXX</p></div>`;
    return;
  }
  try {
    const metaUrl = `data/${encodeURIComponent(rid)}.json`;
    const resp = await fetch(metaUrl, { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    render(data);
  } catch (e) {
    app.innerHTML = `<div class="notfound"><h2>未找到记录 ${escapeHtml(rid)}</h2><p>${escapeHtml(String(e))}</p></div>`;
  }
}

function render(d) {
  const photos = d.photos || [];
  photoList = photos;
  const photoImgs = photos.map((u, i) =>
    `<figure data-idx="${i}"><img src="${escapeHtml(u)}" loading="lazy" alt="照片 ${i + 1}"><span class="zoom-hint">点开放大</span></figure>`
  ).join('');
  const videoBlock = d.video ? `<div class="video-block"><video src="${escapeHtml(d.video)}" controls preload="metadata" playsinline></video></div>` : '';
  const remarkBlock = d.remark ? `<div class="remark">${escapeHtml(d.remark)}</div>` : '';
  app.innerHTML = `
    ${renderHeader(d)}
    <div class="info">
      <div class="info-row"><span class="k">出货点位</span><span class="v">${escapeHtml(d.position || '-')}</span></div>
      <div class="info-row"><span class="k">出货时间</span><span class="v">${escapeHtml(d.dateTime || '-')}</span></div>
      <div class="info-row"><span class="k">照片数量</span><span class="v">${photos.length} 张${d.hasVideo ? ' + 1 视频' : ''}</span></div>
    </div>
    ${remarkBlock}
    ${d.video ? '<div class="section-title">📹 视频</div>' + videoBlock : ''}
    ${photos.length > 0 ? '<div class="section-title">📷 照片（点开可放大）</div><div class="gallery">' + photoImgs + '</div>' : ''}
    <div class="footer">FSINT 出货记录 · ${escapeHtml(new Date().toLocaleString('zh-CN'))}</div>
  `;

  document.querySelectorAll('.gallery figure').forEach(fig => {
    fig.addEventListener('click', () => openLightbox(parseInt(fig.dataset.idx, 10) || 0));
  });
}

/* ================= 全屏看大图 ================= */
const lb     = document.getElementById('lightbox');
const lbImg  = document.getElementById('lb-img');
const lbCnt  = document.getElementById('lb-count');
const lbPrev = document.getElementById('lb-prev');
const lbNext = document.getElementById('lb-next');

let scale = 1, tx = 0, ty = 0;
function applyZoom() { lbImg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
function resetZoom() { scale = 1; tx = 0; ty = 0; applyZoom(); }

function openLightbox(i) {
  if (!photoList.length) return;
  lbIdx = Math.max(0, Math.min(photoList.length - 1, i));
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
  syncLightbox();
}
function closeLightbox() {
  if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
  lb.classList.remove('on');
  document.body.style.overflow = '';
  resetZoom();
}
function syncLightbox() {
  lbImg.src = photoList[lbIdx];
  lbCnt.textContent = (lbIdx + 1) + ' / ' + photoList.length;
  lbPrev.disabled = lbIdx === 0;
  lbNext.disabled = lbIdx === photoList.length - 1;
  resetZoom();
}
lbImg.addEventListener('load', resetZoom);

document.getElementById('lb-close') && document.getElementById('lb-close').addEventListener('click', closeLightbox);
lbPrev.addEventListener('click', () => { if (lbIdx > 0) { lbIdx--; syncLightbox(); } });
lbNext.addEventListener('click', () => { if (lbIdx < photoList.length - 1) { lbIdx++; syncLightbox(); } });
document.addEventListener('keydown', (e) => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft' && lbIdx > 0) { lbIdx--; syncLightbox(); }
  else if (e.key === 'ArrowRight' && lbIdx < photoList.length - 1) { lbIdx++; syncLightbox(); }
});

// ===== 手势：点一下关闭 / 右滑关闭 / 双击放大 / 双指缩放 / 放大后拖动 =====
const SWIPE_CLOSE_PX = 70;    // 右滑超过这个距离就关闭
const TAP_MOVE_PX    = 12;    // 位移小于这个算"点击"
const DOUBLE_TAP_MS  = 280;

const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
let pinchStart = 0, pinchScale = 1;
let panStart = null;      // 放大后拖动
let swipeStart = null;    // 未放大时横向跟手
let tapStartPt = null;
let moved = false;
let tapTimer = null, lastTap = 0;

function handleTap() {
  const now = Date.now();
  if (now - lastTap < DOUBLE_TAP_MS) {                 // 双击 → 缩放
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
    lastTap = 0;
    if (scale > 1) resetZoom(); else { scale = 2.5; tx = 0; ty = 0; applyZoom(); }
    return;
  }
  lastTap = now;
  if (tapTimer) clearTimeout(tapTimer);                // 单击 → 稍后关闭
  tapTimer = setTimeout(() => { tapTimer = null; closeLightbox(); }, DOUBLE_TAP_MS);
}

lbImg.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    pinchStart = dist(e.touches); pinchScale = scale;
    panStart = null; swipeStart = null; tapStartPt = null;
    return;
  }
  if (e.touches.length === 1) {
    const p = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    tapStartPt = p; moved = false;
    if (scale > 1) { panStart = { x: p.x, y: p.y, tx: tx, ty: ty }; swipeStart = null; }
    else           { swipeStart = p; panStart = null; }
  }
}, { passive: true });

lbImg.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && pinchStart) {
    e.preventDefault();
    scale = Math.min(6, Math.max(1, pinchScale * (dist(e.touches) / pinchStart)));
    if (scale === 1) { tx = 0; ty = 0; }
    applyZoom();
    return;
  }
  const t = e.touches[0];
  if (!t) return;
  if (tapStartPt && Math.hypot(t.clientX - tapStartPt.x, t.clientY - tapStartPt.y) > TAP_MOVE_PX) moved = true;

  if (scale > 1 && panStart) {
    e.preventDefault();
    tx = panStart.tx + (t.clientX - panStart.x);
    ty = panStart.ty + (t.clientY - panStart.y);
    applyZoom();
    return;
  }
  if (scale <= 1.01 && swipeStart) {
    const dx = t.clientX - swipeStart.x;
    const dy = t.clientY - swipeStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {                 // 横向跟手
      e.preventDefault();
      lbImg.style.transition = 'none';
      tx = dx; ty = 0;
      applyZoom();
    }
  }
}, { passive: false });

lbImg.addEventListener('touchend', (e) => {
  if (pinchStart) {
    pinchStart = 0;
    if (scale <= 1.01) resetZoom();
    panStart = null; swipeStart = null; tapStartPt = null;
    return;
  }
  if (swipeStart) {
    const dx = tx;
    swipeStart = null;
    if (dx > SWIPE_CLOSE_PX) { closeLightbox(); return; }
    if (dx !== 0) {                                    // 没到阈值 → 弹回
      lbImg.style.transition = 'transform .18s ease';
      tx = 0; ty = 0; applyZoom();
      setTimeout(() => { lbImg.style.transition = 'none'; }, 220);
    }
  }
  panStart = null;
  if (!moved && e.changedTouches && e.changedTouches.length === 1) handleTap();
});

// 桌面端：鼠标单击关闭（带双击判定）
if (!('ontouchstart' in window)) {
  lbImg.style.cursor = 'zoom-out';
  let dTimer = null, dLast = 0;
  lbImg.addEventListener('click', () => {
    const now = Date.now();
    if (now - dLast < DOUBLE_TAP_MS) {
      if (dTimer) { clearTimeout(dTimer); dTimer = null; }
      dLast = 0;
      if (scale > 1) resetZoom(); else { scale = 2.5; tx = 0; ty = 0; applyZoom(); }
      return;
    }
    dLast = now;
    if (dTimer) clearTimeout(dTimer);
    dTimer = setTimeout(() => { dTimer = null; closeLightbox(); }, DOUBLE_TAP_MS);
  });
}

load();
</script>
</body>
</html>
